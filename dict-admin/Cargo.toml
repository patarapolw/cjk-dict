[package]
name = "dict-admin"
version = "0.1.0"
edition = "2024"
description = "Admin CLI: add / remove Yomitan dictionaries in Cloudflare D1 + R2"

[dependencies]
yomitan-parser = { path = "../yomitan-parser", features = ["zip"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
zip = "8.6.0"
