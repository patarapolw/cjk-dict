[package]
name = "dict-admin"
version = "0.2.0"
edition = "2024"
description = "Admin CLI: manage the Yomitan dictionary library, build search.db, upload to R2 with rclone"

[dependencies]
yomitan-parser = { path = "../yomitan-parser", features = ["search"] }
anyhow = "1"
dotenvy = "0.15"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
zip = "8.6.0"
