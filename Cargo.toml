[package]
name = "yomitan-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
itertools = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
zip = "8.6.0"
