name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows too: file locking there has broken tests that pass on Linux
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # yomitan-parser's zip and search features gate most of its tests and its examples.
      # The Tauri app (app/src-tauri) is its own workspace and isn't built here.
      - run: cargo test --workspace --all-features --locked

  app-rust:
    name: Tauri app Rust tests
    # WebView2 is preinstalled on Windows; Linux would need Tauri's WebKitGTK packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # app/src-tauri is its own workspace, which the root one (and the job above) excludes.
      # A debug build without the custom-protocol feature loads the devUrl, so it doesn't
      # need the frontend built to app/dist.
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked

  app-android:
    name: Tauri app Android check
    # The code behind cfg(target_os = "android") and the Android-only dependencies (jni)
    # don't build for the desktop, so the job above never compiles them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android
      # Build scripts (ring, SQLite, zstd) compile C for Android with the NDK that the
      # runner image ships. `cargo check` doesn't link, so no other Android setup is needed.
      - name: Use the NDK's compiler
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml --target aarch64-linux-android --all-targets --locked

  check:
    name: Format, typecheck and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      # app frontend unit tests (Vitest, with Tauri's IPC mocked)
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # the Tauri app is its own workspace, which the root one excludes
      - run: cargo fmt --all --check --manifest-path app/src-tauri/Cargo.toml
