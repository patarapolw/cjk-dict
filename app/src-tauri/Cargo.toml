[package]
name = "cjk-dict-app"
version = "0.1.0"
description = "CJK dictionary search (client for the cjk-dict worker)"
authors = ["patarapolw"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cjk_dict_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2.8"
tauri-plugin-fs = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["io-util"] }
zip = "8.6.0"
# query tokenizer for "~" search (same code dict-admin uses at import)
yomitan-parser = { path = "../../yomitan-parser" }

# Standalone workspace: building the root workspace (dict-admin) must not need WebKit/GTK.
[workspace]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
